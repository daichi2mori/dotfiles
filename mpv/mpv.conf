[thumbfast]
profile-cond='eq(get("script-name"), "thumbfast")'
scale=bilinear
dscale=bilinear
cscale=bilinear
sigmoid-upscaling=no
correct-downscaling=no
deband=no
hwdec=no
interpolation=no
video-sync=audio
