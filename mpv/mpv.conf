osc=no #デフォルトのUIを無効化します。
#border = no #ModernXではボーダーを無効化するのが推奨されているので、そのための設定です。個人的にはボーダーがあったほうが使いやすいと思いますが、推奨通り無効化したい場合はboederの横の#を削除してno設定を有効にしてください。

vo=gpu-next
dither-depth=8
deband=yes
gpu-api=d3d11
gpu-context=d3d11
correct-downscaling=yes
sigmoid-upscaling=yes

hwdec=nvdec-copy
hwdec-codecs=av1

# ============================
#  画面サイズ＆音量
# ============================
# [window-size]
autofit-larger=50%

# autofit-larger=50%
# volume-save=yes

keep-open=yes
idle=yes

# ============================
#  Scaling (VTuber / アニメ向け)
# ============================
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
tscale=oversample


# ============================
